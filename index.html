    // ════════ HELPERS ════════
    const fmtCr = (n) => {
      if (!isFinite(n) || n === 0) return '₹0';
      const cr = n / 10000000;
      if (cr >= 1) return `₹${cr.toFixed(2)} Cr`;
      const lakh = n / 100000;
      if (lakh >= 1) return `₹${lakh.toFixed(2)} L`;
      return `₹${Math.round(n).toLocaleString('en-IN')}`;
    };

    // ════════ CALCULATION ENGINE ════════
    function calculate(input) {
      const zone = POLICY_DATA.zones[input.zoneKey];
      if (!zone) return null;
      const isService = input.activityType === 'Service';
      const isMSME = ['Micro', 'Small', 'Medium'].includes(input.unitType);
      const fci = (input.landValue || 0) + (input.buildingValue || 0) + (input.plantMachinery || 0);
      const baseIPSPercent = isMSME ? zone.msmeIPSPercent : zone.lsiIPSPercent;
      const baseYears = isMSME ? zone.msmeYears : zone.lsiYears;
      const isThrustSector = POLICY_DATA.bonuses.thrustSectors.includes(input.sector);
      const thrustBonusCap = isThrustSector ? POLICY_DATA.bonuses.thrustIPSBonus : 0;
      const thrustBonusYears = isThrustSector ? POLICY_DATA.bonuses.thrustYearsBonus : 0;
      const isSpecialCat = POLICY_DATA.bonuses.specialCategories.includes(input.ownerCategory);
      const specialBonusCap = isSpecialCat ? POLICY_DATA.bonuses.specialCatIPSBonus : 0;
      const effectiveIPSPercent = Math.min(baseIPSPercent + thrustBonusCap + specialBonusCap, 1.20);
      const ipsLifetimeCap = fci * effectiveIPSPercent;
      const eligibilityYears = baseYears + thrustBonusYears;
      const lifetimeIPSRealizable = Math.min(ipsLifetimeCap, (input.annualSGST || 0) * eligibilityYears);
      const landAndBuilding = (input.landValue || 0) + (input.buildingValue || 0);
      const stampDutySaving = landAndBuilding * POLICY_DATA.assumptions.stampDutyRate * zone.stampDutyExempt;
      const annualElectricityCost = (input.electricityUnits || 0) * POLICY_DATA.assumptions.powerTariffPerUnit;
      const annualEDLiability = annualElectricityCost * POLICY_DATA.assumptions.electricityDutyRate;
      let edYears = 0;
      if (isService) edYears = zone.electricityDutyServiceYears;
      else if (zone.electricityDutyMfgFullTenure) edYears = Math.min(eligibilityYears, 10);
      const electricityDutySaving = annualEDLiability * edYears;
      const annualInterestSubsidy = Math.min((input.termLoan || 0) * zone.interestSubsidyPercent, POLICY_DATA.caps.interestSubsidyAnnualCap);
      const interestSubsidy = annualInterestSubsidy * POLICY_DATA.assumptions.interestSubsidyYears;
      let powerTariffSubsidy = 0;
      if (!isService) {
        const cap = isMSME ? POLICY_DATA.caps.powerTariffMSMECap : POLICY_DATA.caps.powerTariffLSICap;
        powerTariffSubsidy = Math.min((input.electricityUnits || 0) * zone.powerTariffRsPerUnit * POLICY_DATA.assumptions.powerTariffSubsidyYears, cap);
      }
      let epfReimbursement = 0;
      if (zone.epfReimbursement) {
        const employees = input.employees || 0;
        const avgBasic = input.avgBasicSalary || 0;
        const annualEmployerPF = employees * avgBasic * 12 * POLICY_DATA.assumptions.employerPFRate;
        if (isService) {
          if (avgBasic >= zone.epfServiceSalaryThreshold) epfReimbursement = Math.min(annualEmployerPF * 0.50 * 5, POLICY_DATA.caps.epfServiceCap);
        } else {
          const cap = isMSME ? POLICY_DATA.caps.epfMfgMSMECap : POLICY_DATA.caps.epfMfgLSICap;
          epfReimbursement = Math.min(annualEmployerPF * zone.epfMfgRate * 5, cap);
        }
      }
      let rentalLeaseSubsidy = 0;
      if (isService) {
        const annualRental = input.annualRental || 0;
        const totalRental = annualRental * POLICY_DATA.caps.rentalSubsidyDurationYears;
        rentalLeaseSubsidy = Math.min(totalRental * 0.50, zone.rentalSubsidyCap);
      }
      let capitalSubsidy = 0;
      if (!isService && (isThrustSector || isMSME)) {
        capitalSubsidy = Math.min(fci * POLICY_DATA.assumptions.capitalSubsidyPercentFCI, POLICY_DATA.caps.capitalSubsidyOverallCap);
      }
      const rawTotal = lifetimeIPSRealizable + stampDutySaving + electricityDutySaving + interestSubsidy + powerTariffSubsidy + epfReimbursement + rentalLeaseSubsidy + capitalSubsidy;
      const overallCapPercent = isSpecialCat ? POLICY_DATA.bonuses.overallCapSpecialCat : POLICY_DATA.bonuses.overallCapStandard;
      const overallCap = fci * overallCapPercent;
      const totalLifetimeSubsidy = Math.min(rawTotal, overallCap);
      const capApplied = rawTotal > overallCap;
      const suggestedCAFee = totalLifetimeSubsidy * 0.05;
      return { zone, zoneKey: input.zoneKey, isService, isMSME, fci, isThrustSector, isSpecialCat, effectiveIPSPercent, ipsLifetimeCap, eligibilityYears, lifetimeIPSRealizable, stampDutyFull: landAndBuilding * POLICY_DATA.assumptions.stampDutyRate, stampDutySaving, annualEDLiability, electricityDutySaving, edYears, interestSubsidy, annualInterestSubsidy, powerTariffSubsidy, epfReimbursement, rentalLeaseSubsidy, capitalSubsidy, rawTotal, overallCap, overallCapPercent, capApplied, totalLifetimeSubsidy, suggestedCAFee };
    }

          <div className="mono" style={{ fontSize: primary ? '1.15rem' : '1rem', fontWeight: primary ? 700 : 600, color: amount > 0 ? '#2D5F5D' : '#C9C0AE', whiteSpace: 'nowrap' }}>{fmtCr(amount)}</div>

    // ════════ MAIN COMPONENT ════════
    function MIISPCalculator() {
      const [activityType, setActivityType] = useState('Manufacturing');
      const [unitType, setUnitType] = useState('Small');
      const [sector, setSector] = useState('General Manufacturing');
      const [ownerCategory, setOwnerCategory] = useState('General');
      const [projectType, setProjectType] = useState('New');
      const [district, setDistrict] = useState('Nagpur');
      const [taluka, setTaluka] = useState('Hingna');
      const [landValue, setLandValue] = useState('');
      const [buildingValue, setBuildingValue] = useState('');
      const [plantMachinery, setPlantMachinery] = useState('');
      const [annualTurnover, setAnnualTurnover] = useState('');
      const [annualSGST, setAnnualSGST] = useState('');
      const [termLoan, setTermLoan] = useState('');
      const [electricityUnits, setElectricityUnits] = useState('');
      const [employees, setEmployees] = useState('');
      const [avgBasicSalary, setAvgBasicSalary] = useState('');
      const [annualRental, setAnnualRental] = useState('');
      const [showResults, setShowResults] = useState(false);
      const [showUpdateLog, setShowUpdateLog] = useState(false);

      const talukaList = VIDARBHA[district] || [];
      const selectedTaluka = talukaList.find(t => t.name === taluka);
      const zoneKey = selectedTaluka?.zone || 'VidarbhaStandard';
      const zone = POLICY_DATA.zones[zoneKey];
      const isService = activityType === 'Service';
      const subSectorOptions = isService 
        ? ['IT / Software', 'BPO / KPO', 'Healthcare', 'Logistics', 'Data Center', 'Education', 'Other Service']
        : ['General Manufacturing', 'Food Processing', 'Green Energy', 'Industry 4.0', 'EV', 'Aerospace'];

      useEffect(() => {
        if (isService && !subSectorOptions.includes(sector)) setSector('IT / Software');
        else if (!isService && !subSectorOptions.includes(sector)) setSector('General Manufacturing');
      }, [activityType]); // eslint-disable-line

      const result = useMemo(() => {
        if (!showResults) return null;
        return calculate({
          zoneKey, activityType, unitType, sector, ownerCategory,
          landValue: parseFloat(landValue) * 100000 || 0,
          buildingValue: parseFloat(buildingValue) * 100000 || 0,
          plantMachinery: parseFloat(plantMachinery) * 100000 || 0,
          annualTurnover: parseFloat(annualTurnover) * 100000 || 0,
          annualSGST: parseFloat(annualSGST) * 100000 || 0,
          termLoan: parseFloat(termLoan) * 100000 || 0,
          electricityUnits: parseFloat(electricityUnits) || 0,
          employees: parseFloat(employees) || 0,
          avgBasicSalary: parseFloat(avgBasicSalary) || 0,
          annualRental: parseFloat(annualRental) * 100000 || 0,
        });
      }, [showResults, zoneKey, activityType, unitType, sector, ownerCategory, landValue, buildingValue, plantMachinery, annualTurnover, annualSGST, termLoan, electricityUnits, employees, avgBasicSalary, annualRental]);

      const zoneComparison = useMemo(() => {

                  </div>
                  {result.capApplied && (<div style={{ marginTop: '1rem', padding: '0.9rem 1.1rem', background: '#FFF8E6', border: '1px solid #E5C687', borderRadius: '6px', fontSize: '0.85rem', color: '#5C5040' }}><strong>⚠ Overall Cap Applied:</strong> Raw incentives summed to {fmtCr(result.rawTotal)}, but MIISP 2025 caps total benefits at {(result.overallCapPercent * 100).toFixed(0)}% of FCI = {fmtCr(result.overallCap)}. Excess of {fmtCr(result.rawTotal - result.overallCap)} is forfeited.</div>)}
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '1.4rem', paddingTop: '1.2rem', borderTop: '2px solid #2D5F5D' }}>
                    <div className="serif" style={{ fontSize: '1.15rem', fontWeight: 600, color: '#1A2E35' }}>Total Realizable</div>
                    <div className="serif mono" style={{ fontSize: '1.5rem', fontWeight: 700, color: '#2D5F5D' }}>{fmtCr(result.totalLifetimeSubsidy)}</div>
                  </div>
                </div>

                {zoneComparison && zoneComparison.length > 0 && (
                  <div className="card" style={{ marginBottom: '1.5rem' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.4rem' }}><Award size={18} style={{ color: '#C97064' }} /><h3 className="serif" style={{ fontSize: '1.4rem', fontWeight: 600, color: '#1A2E35' }}>The "NID Belt" Opportunity</h3></div>
                    <div style={{ fontSize: '0.88rem', color: '#6B5D4F', marginBottom: '1.3rem', fontStyle: 'italic' }} className="serif">If this same project were set up in a Naxal-affected / Aspirational District taluka (Gadchiroli, Washim, Dharni, etc.):</div>
                    <div style={{ display: 'grid', gap: '0.7rem' }}>
                      {zoneComparison.map(c => {
                        const diff = c.result.totalLifetimeSubsidy - result.totalLifetimeSubsidy;
                        const cfg = POLICY_DATA.zones[c.zoneKey];
                        return (
                          <div key={c.zoneKey} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.9rem 1.1rem', background: '#FBF7F0', borderRadius: '8px', border: '1px solid #EDE3CF' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.8rem' }}><span className="zone-badge" style={{ background: cfg.accent, color: 'white', minWidth: '70px', justifyContent: 'center' }}>{cfg.short}</span><div><div style={{ fontWeight: 600, fontSize: '0.92rem', color: '#1A2E35' }}>{cfg.label}</div><div style={{ fontSize: '0.78rem', color: '#8B7E6B' }}>{cfg.description}</div></div></div>
                            <div style={{ textAlign: 'right' }}><div className="mono" style={{ fontSize: '1.05rem', fontWeight: 600, color: '#2D5F5D' }}>{fmtCr(c.result.totalLifetimeSubsidy)}</div><div className="mono" style={{ fontSize: '0.78rem', color: diff > 0 ? '#7C9885' : '#8B7E6B', fontWeight: 600 }}>{diff > 0 ? '+' : ''}{fmtCr(diff)} {diff > 0 ? 'extra' : 'same'}</div></div>
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ marginTop: '1rem', fontSize: '0.78rem', color: '#8B7E6B', fontStyle: 'italic' }}>Note: Both zones may yield the same total when the 100% FCI cap binds. NID's true edge: faster IPS realization timeline and headroom for low-SGST projects.</div>
                  </div>
                )}

                <div className="card no-print" style={{ marginBottom: '1.5rem', background: 'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)', textAlign: 'center', padding: '1.8rem' }}>
                  <div className="serif" style={{ fontSize: '1.15rem', fontWeight: 600, marginBottom: '0.5rem', color: '#1A2E35' }}>Ready to claim this subsidy?</div>
                  <div style={{ fontSize: '0.88rem', color: '#5C5040', marginBottom: '1.2rem' }}>EC must be filed on invest.maharashtra.gov.in <strong>before commencement of commercial production</strong>. Talk to CA Shrikant for end-to-end handling.</div>
                  <div style={{ display: 'flex', gap: '0.7rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                    <a href={whatsappResultsUrl} target="_blank" rel="noopener noreferrer" className="btn-whatsapp">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style={{ flexShrink: 0 }}>
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                      </svg>
                      Discuss with CA Shrikant
                    </a>
                    <button className="btn-primary" onClick={handlePrint}><Printer size={16} style={{ marginRight: '0.4rem', display: 'inline', verticalAlign: 'middle' }} />Print Report</button>
                  </div>
                  <div style={{ fontSize: '0.74rem', color: '#8B7E6B', marginTop: '0.9rem', fontStyle: 'italic' }}>WhatsApp will open with your calculation pre-filled — just tap Send.</div>
                </div>

                <div className="card" style={{ background: '#FFF8E6', border: '1px solid #E5C687' }}>
                  <div style={{ display: 'flex', gap: '0.7rem' }}>
                    <AlertCircle size={18} style={{ color: '#C97064', flexShrink: 0, marginTop: '2px' }} />
                    <div style={{ fontSize: '0.82rem', color: '#5C5040', lineHeight: 1.6 }}><strong>Disclaimers:</strong> Quantum percentages verified from MIISP 2025 GR No. {POLICY_GR_NUMBER} dated {POLICY_DATE} (via Grant Thornton Bharat Jan 2026 analysis). NID-taluka classification within Vidarbha is best-estimate pending official Annexure-I. Stamp duty rate assumed {(POLICY_DATA.assumptions.stampDutyRate * 100).toFixed(0)}%, electricity duty {(POLICY_DATA.assumptions.electricityDutyRate * 100).toFixed(0)}%, power tariff ₹{POLICY_DATA.assumptions.powerTariffPerUnit}/unit, employer PF rate {(POLICY_DATA.assumptions.employerPFRate * 100).toFixed(0)}%. Service-sector calculations assume rental subsidy first-20-per-district eligibility holds. <strong>Internal estimation tool only — not a representation to any government department.</strong> Final claim quantum determined by Directorate of Industries based on actual MIISP 2025 provisions and compliance status.</div>
                  </div>
                </div>
              </div>
            )}

            <footer style={{ textAlign: 'center', marginTop: '3.5rem', paddingTop: '2rem', borderTop: '1px solid #E5DCC9', color: '#8B7E6B', fontSize: '0.82rem' }}>
              <div className="serif" style={{ fontSize: '1rem', fontWeight: 600, color: '#1A2E35', marginBottom: '0.4rem' }}>CA Shrikant Dubey & Co.</div>
              <div>Chartered Accountants · Nagpur · 30+ years of practice</div>
              <div style={{ marginTop: '0.3rem' }}>+91 9403 586 900 · Vande Anudaan Initiative</div>
              <div style={{ marginTop: '0.6rem', fontSize: '0.72rem', color: '#A89880' }}>{TOOL_VERSION} · {POLICY_VERSION} · Last verified {LAST_VERIFIED}</div>
            </footer>
          </div>

          {/* Floating WhatsApp button — always visible */}
          <a href={whatsappGeneralUrl} target="_blank" rel="noopener noreferrer" className="whatsapp-float" aria-label="Chat with CA Shrikant on WhatsApp" title="Discuss with CA Shrikant">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
          </a>
        </div>
      );
    }

    // ════════ MOUNT ════════
    const root = createRoot(document.getElementById('root'));
    root.render(<MIISPCalculator />);
    
    // Hide loading splash
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade');
        setTimeout(() => loading.remove(), 400);
      }
    }, 300);
  </script>

</body>
</html>
