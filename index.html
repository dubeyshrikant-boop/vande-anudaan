// ════ HELPERS ════
const fmtCr = (n) => {
  if (!isFinite(n) || n === 0) return '₹0';
  const cr = n / 10000000;
  if (cr >= 1) return `₹${cr.toFixed(2)} Cr`;
  const lakh = n / 100000;
  if (lakh >= 1) return `₹${lakh.toFixed(2)} L`;
  return `₹${Math.round(n).toLocaleString('en-IN')}`;
};
const buildWa = (msg) => `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;

// ════ CALCULATION ENGINES ════
function calcMIISP(input) {
  const zone = POLICY_DATA.zones[input.zoneKey];
  const isService = input.activityType === 'Service';
  const isMSME = ['Micro', 'Small', 'Medium'].includes(input.unitType);
  const fci = (input.landValue || 0) + (input.buildingValue || 0) + (input.plantMachinery || 0);
  const baseIPS = isMSME ? zone.msmeIPSPercent : zone.lsiIPSPercent;
  const baseYears = isMSME ? zone.msmeYears : zone.lsiYears;
  const isThrust = POLICY_DATA.bonuses.thrustSectors.includes(input.sector);
  const tBonus = isThrust ? POLICY_DATA.bonuses.thrustIPSBonus : 0;
  const tYears = isThrust ? POLICY_DATA.bonuses.thrustYearsBonus : 0;
  const isSpecial = POLICY_DATA.bonuses.specialCategories.includes(input.ownerCategory);
  const sBonus = isSpecial ? POLICY_DATA.bonuses.specialCatIPSBonus : 0;
  const effIPS = Math.min(baseIPS + tBonus + sBonus, 1.20);
  const ipsCap = fci * effIPS;
  const eligYears = baseYears + tYears;
  const ipsRealizable = Math.min(ipsCap, (input.annualSGST || 0) * eligYears);
  const landBld = (input.landValue || 0) + (input.buildingValue || 0);
  const stampSaving = landBld * POLICY_DATA.assumptions.stampDutyRate * zone.stampDutyExempt;
  const annualEC = (input.electricityUnits || 0) * POLICY_DATA.assumptions.powerTariffPerUnit;
  const annualED = annualEC * POLICY_DATA.assumptions.electricityDutyRate;
  let edYears = isService ? zone.electricityDutyServiceYears : (zone.electricityDutyMfgFullTenure ? Math.min(eligYears, 10) : 0);
  const edSaving = annualED * edYears;
  const annualInt = Math.min((input.termLoan || 0) * zone.interestSubsidyPercent, POLICY_DATA.caps.interestSubsidyAnnualCap);
  const intSubsidy = annualInt * POLICY_DATA.assumptions.interestSubsidyYears;
  let powerTariff = 0;
  if (!isService) {
    const cap = isMSME ? POLICY_DATA.caps.powerTariffMSMECap : POLICY_DATA.caps.powerTariffLSICap;
    powerTariff = Math.min((input.electricityUnits || 0) * zone.powerTariffRsPerUnit * POLICY_DATA.assumptions.powerTariffSubsidyYears, cap);
  }
  let epf = 0;
  if (zone.epfReimbursement) {
    const annPF = (input.employees || 0) * (input.avgBasicSalary || 0) * 12 * POLICY_DATA.assumptions.employerPFRate;
    if (isService) { if ((input.avgBasicSalary || 0) >= zone.epfServiceSalaryThreshold) epf = Math.min(annPF * 0.50 * 5, POLICY_DATA.caps.epfServiceCap); }
    else { const cap = isMSME ? POLICY_DATA.caps.epfMfgMSMECap : POLICY_DATA.caps.epfMfgLSICap; epf = Math.min(annPF * zone.epfMfgRate * 5, cap); }
  }
  let rental = isService ? Math.min((input.annualRental || 0) * POLICY_DATA.caps.rentalSubsidyDurationYears * 0.50, zone.rentalSubsidyCap) : 0;
  let capSub = (!isService && (isThrust || isMSME)) ? Math.min(fci * POLICY_DATA.assumptions.capitalSubsidyPercentFCI, POLICY_DATA.caps.capitalSubsidyOverallCap) : 0;
  const raw = ipsRealizable + stampSaving + edSaving + intSubsidy + powerTariff + epf + rental + capSub;
  const overallCap = fci * (isSpecial ? POLICY_DATA.bonuses.overallCapSpecialCat : POLICY_DATA.bonuses.overallCapStandard);
  const total = Math.min(raw, overallCap);
  return { zone, isService, isMSME, fci, isThrust, isSpecial, effIPS, eligYears, ipsRealizable, stampSaving, edSaving, edYears, intSubsidy, powerTariff, epf, rental, capSub, raw, overallCap, capApplied: raw > overallCap, total, fee: total * 0.05 };
}

function calcMargin(input, schemeName) {
  const cost = input.projectCost || 0;
  const isMfg = input.activity === 'Manufacturing';
  const isPMEGP = schemeName === 'PMEGP';
  const maxCost = isMfg ? 5000000 : (isPMEGP ? 2000000 : 1000000);
  if (cost > maxCost) return { error: `Project cost ${fmtCr(cost)} exceeds ${isMfg ? 'Mfg' : (isPMEGP ? 'Service' : 'Service/Business')} cap of ${fmtCr(maxCost)}` };
  const isSpecial = input.category !== 'General';
  const isRural = input.location === 'Rural';
  const marginPercent = (!isSpecial && !isRural) ? 0.15 : ((!isSpecial && isRural) || (isSpecial && !isRural)) ? 0.25 : 0.35;
  const ownContribPercent = isSpecial ? 0.05 : 0.10;
  const marginMoney = cost * marginPercent;
  const ownContrib = cost * ownContribPercent;
  const bankLoan = cost - marginMoney - ownContrib;
  return { marginPercent, ownContribPercent, marginMoney, ownContrib, bankLoan, cost, isMfg, isSpecial, isRural, fee: Math.max(marginMoney * 0.08, 25000) };
}

function calcCLCSS(input) {
  const pm = input.plantMachinery || 0;
  const eligiblePM = Math.min(pm, 10000000);
  const subsidy = Math.min(eligiblePM * 0.15, 1500000);
  return { pm, eligiblePM, subsidy, capApplied: pm * 0.15 > 1500000, fee: Math.max(subsidy * 0.10, 25000) };
}

function calcPMFME(input) {
  const cost = input.projectCost || 0;
  const subsidy35 = cost * 0.35;
  const subsidy = Math.min(subsidy35, 1000000);
  const bankLoan = cost * 0.55;
  const ownContrib = cost - subsidy - bankLoan;
  return { cost, subsidy, capApplied: subsidy35 > 1000000, bankLoan, ownContrib, fee: Math.max(subsidy * 0.10, 25000) };
}

// ════ MIISP CALCULATOR ════
function MIISPCalc({ scheme, onBack }) {
  const [activityType, setActivityType] = useState('Manufacturing');
  const [unitType, setUnitType] = useState('Small');
  const [sector, setSector] = useState('General Manufacturing');
  const [ownerCategory, setOwnerCategory] = useState('General');
  const [district, setDistrict] = useState('Nagpur');
  const [taluka, setTaluka] = useState('Hingna');
  const [landValue, setLandValue] = useState('');
  const [buildingValue, setBuildingValue] = useState('');
  const [plantMachinery, setPlantMachinery] = useState('');
  const [annualTurnover, setAnnualTurnover] = useState('');
  const [annualSGST, setAnnualSGST] = useState('');
  const [termLoan, setTermLoan] = useState('');
  const [electricityUnits, setElectricityUnits] = useState('');
  const [employees, setEmployees] = useState('');
  const [avgBasicSalary, setAvgBasicSalary] = useState('');
  const [annualRental, setAnnualRental] = useState('');
  const [showResults, setShowResults] = useState(false);
  const talukaList = VIDARBHA[district] || [];
  const selectedTaluka = talukaList.find(t => t.name === taluka);
  const zoneKey = selectedTaluka?.zone || 'VidarbhaStandard';
  const isService = activityType === 'Service';
  const subSectorOptions = isService ? ['IT / Software', 'BPO / KPO', 'Healthcare', 'Logistics', 'Data Center', 'Education', 'Other Service'] : ['General Manufacturing', 'Food Processing', 'Green Energy', 'Industry 4.0', 'EV', 'Aerospace'];
  useEffect(() => { if (isService && !subSectorOptions.includes(sector)) setSector('IT / Software'); else if (!isService && !subSectorOptions.includes(sector)) setSector('General Manufacturing'); }, [activityType]);

  const result = useMemo(() => showResults ? calcMIISP({ zoneKey, activityType, unitType, sector, ownerCategory, landValue:parseFloat(landValue)*100000||0, buildingValue:parseFloat(buildingValue)*100000||0, plantMachinery:parseFloat(plantMachinery)*100000||0, annualSGST:parseFloat(annualSGST)*100000||0, termLoan:parseFloat(termLoan)*100000||0, electricityUnits:parseFloat(electricityUnits)||0, employees:parseFloat(employees)||0, avgBasicSalary:parseFloat(avgBasicSalary)||0, annualRental:parseFloat(annualRental)*100000||0 }) : null, [showResults, zoneKey, activityType, unitType, sector, ownerCategory, landValue, buildingValue, plantMachinery, annualSGST, termLoan, electricityUnits, employees, avgBasicSalary, annualRental]);

  const waUrl = useMemo(() => {
    if (!result) return '#';

      <div className="deco-line"></div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'1rem', marginBottom:'1.4rem' }}>
        <div><label className="label-text">Unit Size</label><select className="input-field" value={unitType} onChange={e => setUnitType(e.target.value)}><option>Micro</option><option>Small</option><option>Medium</option><option>Large Scale (LSI)</option><option>Special LSI</option><option>Mega</option></select></div>
        <div><label className="label-text">{isService ? 'Service Sub-Sector' : 'Manufacturing Sub-Sector'}</label><select className="input-field" value={sector} onChange={e => setSector(e.target.value)}>{subSectorOptions.map(opt => <option key={opt}>{opt}</option>)}</select></div>
        <div><label className="label-text">Owner Category</label><select className="input-field" value={ownerCategory} onChange={e => setOwnerCategory(e.target.value)}><option>General</option><option>Women</option><option>SC</option><option>ST</option><option>PwD</option></select></div>

        <div><label className="label-text">District</label><select className="input-field" value={district} onChange={e => { setDistrict(e.target.value); setTaluka(VIDARBHA[e.target.value][0].name); }}>{Object.keys(VIDARBHA).map(d => <option key={d}>{d}</option>)}</select></div>
        <div><label className="label-text">Taluka</label><select className="input-field" value={taluka} onChange={e => setTaluka(e.target.value)}>{talukaList.map(t => <option key={t.name}>{t.name}</option>)}</select></div>

      </div>
      <div className="deco-line"></div>
      <div style={{ display:'flex', alignItems:'center', gap:'0.6rem', marginBottom:'1rem' }}><Building2 size={18} style={{ color:'#B8956A' }} /><h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, color:'#1A2E35', margin:0 }}>Fixed Capital Investment <span style={{ fontSize:'0.8rem', fontWeight:400, color:'#8B7E6B' }}>(₹ Lakhs)</span></h3></div>

        <div><label className="label-text">Total FCI</label><div className="mono" style={{ padding:'0.7rem 0.9rem', background:'#F5EFE0', borderRadius:'6px', fontSize:'0.9rem', color:'#2D5F5D', fontWeight:600 }}>{fmtCr(((parseFloat(landValue) || 0) + (parseFloat(buildingValue) || 0) + (parseFloat(plantMachinery) || 0)) * 100000)}</div></div>
      </div>
      <div className="deco-line"></div>
      <div style={{ display:'flex', alignItems:'center', gap:'0.6rem', marginBottom:'1rem' }}><Zap size={18} style={{ color:'#4A7C7E' }} /><h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, color:'#1A2E35', margin:0 }}>Operations <span style={{ fontSize:'0.8rem', fontWeight:400, color:'#8B7E6B' }}>(annual)</span></h3></div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem', marginBottom:'1.4rem' }}>
        <div><label className="label-text">Turnover (₹ L)</label><input className="input-field mono" type="number" value={annualTurnover} onChange={e => { setAnnualTurnover(e.target.value); if (!annualSGST) setAnnualSGST((parseFloat(e.target.value) * 0.09).toFixed(2)); }} placeholder="800" /></div>
        <div><label className="label-text">Annual SGST (₹ L)</label><input className="input-field mono" type="number" value={annualSGST} onChange={e => setAnnualSGST(e.target.value)} placeholder="72" /></div>
        <div><label className="label-text">Term Loan (₹ L)</label><input className="input-field mono" type="number" value={termLoan} onChange={e => setTermLoan(e.target.value)} placeholder="300" /></div>
        <div><label className="label-text">Electricity (units)</label><input className="input-field mono" type="number" value={electricityUnits} onChange={e => setElectricityUnits(e.target.value)} placeholder="200000" /></div>

        <div><label className="label-text">Avg Basic Salary (₹/mo)</label><input className="input-field mono" type="number" value={avgBasicSalary} onChange={e => setAvgBasicSalary(e.target.value)} placeholder="18000" /></div>
        {isService && (<div><label className="label-text">Annual Rental (₹ L)</label><input className="input-field mono" type="number" value={annualRental} onChange={e => setAnnualRental(e.target.value)} placeholder="36" /></div>)}
      </div>
      <div style={{ textAlign:'center', marginTop:'1.5rem' }}>
        <button className="btn-primary" onClick={() => { setShowResults(true); setTimeout(() => { const el = document.getElementById('results'); if (el) el.scrollIntoView({ behavior:'smooth' }); }, 100); }}>Calculate Subsidy <ArrowRight size={16} style={{ marginLeft:'0.4rem', display:'inline', verticalAlign:'middle' }} /></button>
      </div>
    </div>

    {result && <div id="results">
      <div className="card" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #1A2E35 0%, #2D5F5D 100%)', color:'#FBF7F0', border:'none', textAlign:'center', padding:'2.5rem 1.5rem' }}>
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.3em', textTransform:'uppercase', color:'#A8C5B5', marginBottom:'0.8rem' }}>Total Lifetime Subsidy</div>
        <div className="serif" style={{ fontSize:'clamp(2.6rem, 7vw, 4.2rem)', fontWeight:600, lineHeight:1, letterSpacing:'-0.02em', marginBottom:'0.5rem' }}>{fmtCr(result.total)}</div>
        <div style={{ fontSize:'0.9rem', color:'#A8C5B5', fontStyle:'italic' }} className="serif">{result.isService ? 'Service' : 'Manufacturing'} · {result.eligYears} years · {result.zone.short} · FCI {fmtCr(result.fci)}</div>
        <div style={{ marginTop:'1.2rem', paddingTop:'1.2rem', borderTop:'1px solid rgba(255,255,255,0.15)', display:'inline-block' }}>
          <div style={{ fontSize:'0.72rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'#A8C5B5', marginBottom:'0.3rem' }}>CA Fee (5%)</div>
          <div className="serif mono" style={{ fontSize:'1.4rem', fontWeight:600, color:'#E5C687' }}>{fmtCr(result.fee)}</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom:'1.5rem' }}>
        <h3 className="serif" style={{ fontSize:'1.3rem', fontWeight:600, marginBottom:'1.1rem', color:'#1A2E35' }}>Incentive Breakdown</h3>
        <BreakdownRow label="IPS (SGST Refund)" detail={`${(result.effIPS * 100).toFixed(0)}% of FCI × ${result.eligYears} yrs`} amount={result.ipsRealizable} primary />
        <BreakdownRow label="Stamp Duty Exemption" detail="100% on first deed (Land + Building)" amount={result.stampSaving} />
        <BreakdownRow label="Electricity Duty Exemption" detail={`Full exemption × ${result.edYears} yrs`} amount={result.edSaving} />
        <BreakdownRow label="Interest Subsidy" detail="5% on term loan × 5 yrs (cap ₹1 Cr/yr)" amount={result.intSubsidy} />
        {!result.isService && <BreakdownRow label="Power Tariff Subsidy" detail="₹1/unit × 3 yrs" amount={result.powerTariff} />}
        <BreakdownRow label="EPF Reimbursement" detail={result.isService ? '50% × Employer PF × 5 yrs (salary ≥ ₹50K)' : '50% × Employer PF × 5 yrs'} amount={result.epf} />
        {result.isService && <BreakdownRow label="Rental Lease Subsidy" detail="50% × Annual Rental × 5 yrs (cap ₹1 Cr)" amount={result.rental} />}
        {!result.isService && <BreakdownRow label="Capital Subsidy" detail="20% of FCI (cap ₹25 Cr)" amount={result.capSub} />}
        {result.capApplied && (<div style={{ marginTop:'1rem', padding:'0.85rem 1rem', background:'#FFF8E6', border:'1px solid #E5C687', borderRadius:'6px', fontSize:'0.85rem', color:'#5C5040' }}><strong>⚠ Overall Cap Applied:</strong> Raw {fmtCr(result.raw)} capped at {(result.overallCap === result.fci ? '100' : '120')}% of FCI = {fmtCr(result.overallCap)}.</div>)}
      </div>

      <div className="card no-print" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)', textAlign:'center', padding:'1.8rem' }}>
        <div className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'0.5rem', color:'#1A2E35' }}>Ready to claim?</div>
        <div style={{ fontSize:'0.88rem', color:'#5C5040', marginBottom:'1.2rem' }}>EC file कर के <strong>commercial production शुरू करने से पहले</strong> apply करें। हम end-to-end handle करते हैं।</div>
        <div style={{ display:'flex', gap:'0.7rem', justifyContent:'center', flexWrap:'wrap' }}>
          <WaButton url={waUrl} />
          <button className="btn-primary" onClick={() => window.print()}><Printer size={16} style={{ marginRight:'0.4rem', display:'inline', verticalAlign:'middle' }} />Print</button>
        </div>
      </div>
    </div>}
    <Footer />
  </div>;
}

// ════ MARGIN MONEY CALCULATOR (PMEGP / CMEGP shared) ════
function MarginCalc({ scheme, onBack }) {
  const [activity, setActivity] = useState('Manufacturing');
  const [location, setLocation] = useState('Rural');
  const [category, setCategory] = useState('General');
  const [projectCost, setProjectCost] = useState('');
  const [showResults, setShowResults] = useState(false);
  const result = useMemo(() => showResults ? calcMargin({ activity, location, category, projectCost:parseFloat(projectCost)*100000||0 }, scheme.name) : null, [showResults, activity, location, category, projectCost, scheme.name]);

  const waUrl = useMemo(() => {
    if (!result || result.error) return '#';
    const lines = ['नमस्कार CA Shrikant सर 🙏', '', `मैंने *${scheme.name} Calculator* से check किया:`, '', '📊 *Results*', `• Project Cost: ${fmtCr(result.cost)}`, `• Margin Money (Subsidy): ${fmtCr(result.marginMoney)} (${(result.marginPercent * 100).toFixed(0)}%)`, `• Bank Loan: ${fmtCr(result.bankLoan)}`, `• Own Contribution: ${fmtCr(result.ownContrib)} (${(result.ownContribPercent * 100).toFixed(0)}%)`, '', '🏭 *Details*', `• Activity: ${result.isMfg ? 'Manufacturing' : 'Service/Business'}`, `• Location: ${result.isRural ? 'Rural' : 'Urban'}`, `• Category: ${category}`, '', 'मुझे DPR + filing assistance चाहिए।', '', '— Vande Anudaan'];
    return buildWa(lines.join('\n'));
  }, [result, scheme.name, category]);

  return <div style={{ maxWidth:'900px', margin:'0 auto', padding:'2.5rem 1.5rem' }}>
    <BackToPortal onBack={onBack} />
    <SchemeHeader scheme={scheme} />
    <div className="card no-print" style={{ marginBottom:'2rem', background:'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)', border:'1px solid #E5C687' }}>
      <div style={{ display:'flex', alignItems:'flex-start', gap:'0.9rem' }}>
        <Info size={20} style={{ color:scheme.color, marginTop:'2px', flexShrink:0 }} />
        <div style={{ fontSize:'0.88rem', color:'#5C5040', lineHeight:1.55 }}>
          {scheme.name === 'PMEGP' ? <><strong>PMEGP</strong> Central scheme. Mfg up to ₹50 L, Service up to ₹20 L. Margin Money 15-35% as subsidy. Implementing: KVIC, KVIB, DIC.</> : <><strong>CMEGP</strong> Maharashtra state scheme (PMEGP का state version). Mfg up to ₹50 L, Service/Business up to ₹10 L. MH residents only, age 18-45.</>}
        </div>
      </div>
    </div>
    <div className="card no-print" style={{ marginBottom:'2rem' }}>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem', marginBottom:'1.4rem' }}>
        <div><label className="label-text">Activity</label><select className="input-field" value={activity} onChange={e => setActivity(e.target.value)}><option>Manufacturing</option><option>{scheme.name === 'PMEGP' ? 'Service' : 'Service/Business'}</option></select></div>
        <div><label className="label-text">Location</label><select className="input-field" value={location} onChange={e => setLocation(e.target.value)}><option>Rural</option><option>Urban</option></select></div>
        <div><label className="label-text">Beneficiary Category</label><select className="input-field" value={category} onChange={e => setCategory(e.target.value)}><option>General</option><option>SC</option><option>ST</option><option>OBC</option><option>Women</option><option>Ex-Servicemen</option><option>PwD</option><option>Minority</option><option>NER / Hill</option></select></div>
        <div><label className="label-text">Project Cost (₹ Lakhs)</label><input className="input-field mono" type="number" value={projectCost} onChange={e => setProjectCost(e.target.value)} placeholder={activity === 'Manufacturing' ? '25' : '10'} /></div>
      </div>
      <div style={{ textAlign:'center' }}><button className="btn-primary" onClick={() => setShowResults(true)}>Calculate {scheme.name} Subsidy <ArrowRight size={16} style={{ marginLeft:'0.4rem', display:'inline', verticalAlign:'middle' }} /></button></div>

    {result && result.error && <div className="card" style={{ marginBottom:'1.5rem', background:'#FFF0E5', borderLeft:'4px solid #C97064' }}><div style={{ display:'flex', gap:'0.6rem' }}><AlertCircle size={20} style={{ color:'#C97064', flexShrink:0 }} /><div style={{ fontSize:'0.92rem', color:'#1A2E35', fontWeight:500 }}>{result.error}</div></div></div>}

    {result && !result.error && <>
      <div className="card" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #1A2E35 0%, #2D5F5D 100%)', color:'#FBF7F0', border:'none', textAlign:'center', padding:'2.3rem 1.5rem' }}>
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.3em', textTransform:'uppercase', color:'#A8C5B5', marginBottom:'0.7rem' }}>Margin Money Subsidy</div>
        <div className="serif" style={{ fontSize:'clamp(2.4rem, 6vw, 3.6rem)', fontWeight:600, lineHeight:1, marginBottom:'0.5rem' }}>{fmtCr(result.marginMoney)}</div>
        <div style={{ fontSize:'0.9rem', color:'#A8C5B5', fontStyle:'italic' }} className="serif">{(result.marginPercent * 100).toFixed(0)}% of Project Cost · {result.isRural ? 'Rural' : 'Urban'} · {category}</div>
      </div>
      <div className="card" style={{ marginBottom:'1.5rem' }}>
        <h3 className="serif" style={{ fontSize:'1.3rem', fontWeight:600, marginBottom:'1.1rem', color:'#1A2E35' }}>Funding Structure</h3>
        <BreakdownRow label="Margin Money (Govt Subsidy)" detail={`${(result.marginPercent * 100).toFixed(0)}% — credit-linked subsidy`} amount={result.marginMoney} primary />
        <BreakdownRow label="Bank Term Loan" detail="PSU / RRB / Co-op bank" amount={result.bankLoan} />
        <BreakdownRow label="Own Contribution" detail={`${(result.ownContribPercent * 100).toFixed(0)}% promoter equity`} amount={result.ownContrib} />
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'1.2rem', paddingTop:'1rem', borderTop:'2px solid #2D5F5D' }}>
          <div className="serif" style={{ fontSize:'1.1rem', fontWeight:600, color:'#1A2E35' }}>Total Project Cost</div>
          <div className="serif mono" style={{ fontSize:'1.4rem', fontWeight:700, color:'#2D5F5D' }}>{fmtCr(result.cost)}</div>
        </div>
      </div>
      <div className="card no-print" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)', textAlign:'center', padding:'1.8rem' }}>
        <div className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'0.5rem', color:'#1A2E35' }}>DPR + Filing Help</div>
        <div style={{ fontSize:'0.88rem', color:'#5C5040', marginBottom:'1.2rem' }}>{scheme.name} application: <strong>Bankable DPR + EDP Training + Bank Liaison + Subsidy Filing</strong>. End-to-end handle करते हैं।</div>
        <div style={{ display:'flex', gap:'0.7rem', justifyContent:'center', flexWrap:'wrap' }}><WaButton url={waUrl} /><button className="btn-primary" onClick={() => window.print()}><Printer size={16} style={{ marginRight:'0.4rem', display:'inline', verticalAlign:'middle' }} />Print</button></div>
      </div>
    </>}
    <Footer />
  </div>;
}

        <div className="serif" style={{ fontSize:'clamp(2.4rem, 6vw, 3.6rem)', fontWeight:600, lineHeight:1, marginBottom:'0.5rem' }}>{fmtCr(result.subsidy)}</div>
        <div style={{ fontSize:'0.9rem', color:'#A8C5B5', fontStyle:'italic' }} className="serif">15% on P&M of {fmtCr(result.eligiblePM)} {result.capApplied && '(capped at ₹15 L)'}</div>

      <div className="card" style={{ marginBottom:'1.5rem' }}>

// ════ ELIGIBILITY ENGINE — evaluates profile against all 43 schemes ════
function evaluateSchemes(p) {
  const fci = (parseFloat(p.projectCost) || 0) * 100000;
  const pm = (parseFloat(p.plantMachinery) || 0) * 100000;
  const mhResident = p.state === 'Maharashtra';
  const isSpecial = ['SC','ST','OBC','Women','Minority','PwD','Ex-Servicemen'].includes(p.ownerCategory);
  const isSCST = p.ownerCategory === 'SC' || p.ownerCategory === 'ST';
  const isMfg = p.activity === 'Manufacturing';
  const isService = p.activity === 'Service';
  const isFood = p.activity === 'Food Processing';
  const isAgri = p.activity === 'Agriculture/Dairy';
  const isTextile = p.activity === 'Textile';
  const isKhadi = p.activity === 'Khadi/Village';
  const isIT = p.activity === 'IT/ITES';
  const isMSME = ['Micro','Small','Medium'].includes(p.unitSize);
  const isMicro = p.unitSize === 'Micro';
  const isRural = p.location === 'Rural';
  const isVidarbha = p.zone === 'Vidarbha-Std' || p.zone === 'Vidarbha-NID';
  const isNID = p.zone === 'Vidarbha-NID';
  const ageOk = !p.age || p.age === '18-45';
  const E = (id, q, rate, reason, extra = {}) => ({ id, quantum: q || 0, ratePct: rate || 0, reason, ...extra });
  const out = [];

  // ── MIISP 2025 (MH industrial — flagship) ──
  if (mhResident && (isMfg || isService) && p.stage !== 'Existing') {
    const ipsPct = isNID ? 1.00 : (isVidarbha ? 0.80 : 0.50);
    let bonus = 0;
    if (['Food Processing','EV','Aerospace','Green Energy','Industry 4.0'].some(s => p.subSector === s || p.activity === s)) bonus += 0.20;
    if (['Women','SC','ST'].includes(p.ownerCategory)) bonus += 0.20;
    const effIPS = Math.min(ipsPct + bonus, 1.20);
    const ipsBenefit = fci * effIPS;
    const stamp = fci * 0.4 * 0.06;
    const ed = fci * 0.05;
    const epf = fci * 0.04;
    const capSub = !isService && isMSME ? Math.min(fci * 0.20, 250000000) : 0;
    const total = ipsBenefit + stamp + ed + epf + capSub;
    out.push(E('miisp-2025', total, effIPS * 100, `${(effIPS*100).toFixed(0)}% IPS + Stamp Duty + ED + EPF + Capital Subsidy (stacked, ${isNID ? 'NID' : isVidarbha ? 'Vidarbha 80%' : 'Other zone 50%'})`, { hasCalc: true }));
  }

  // ── CMEGP (MH margin money) ──
  if (mhResident && p.stage === 'New' && ageOk) {
    const maxPC = isMfg ? 5000000 : 1000000;
    if (fci > 0 && fci <= maxPC) {
      const m = isRural ? (isSpecial ? 0.35 : 0.25) : (isSpecial ? 0.25 : 0.15);
      out.push(E('cmegp', fci * m, m * 100, `${(m*100).toFixed(0)}% margin money (${isRural?'Rural':'Urban'}, ${isSpecial?'Special':'General'} cat.)`, { hasCalc: true }));
    }
  }

  // ── PMEGP (Central margin money) ──
  if (p.stage === 'New') {
    const maxPC = isMfg ? 5000000 : 2000000;
    if (fci > 0 && fci <= maxPC) {
      const m = isRural ? (isSpecial ? 0.35 : 0.25) : (isSpecial ? 0.25 : 0.15);
      out.push(E('pmegp', fci * m, m * 100, `${(m*100).toFixed(0)}% margin money (${isRural?'Rural':'Urban'}, ${isSpecial?'Special':'General'} cat.)`, { hasCalc: true }));
    }
  }

  // ── CLCSS (Central 15% on P&M) ──
  if (isMSME && isMfg && pm > 0) {
    const elig = Math.min(pm, 10000000);
    out.push(E('clcss', Math.min(elig * 0.15, 1500000), 15, '15% on P&M for tech upgradation (51 sub-sectors, cap ₹15L)', { hasCalc: true }));
  }

  // ── SCLCSS (Central 25% for SC/ST) ──
  if (isMSME && isMfg && isSCST && pm > 0) {
    out.push(E('sclcss', Math.min(pm * 0.25, 2500000), 25, `25% on P&M (${p.ownerCategory} entrepreneur, cap ₹25L) — higher than CLCSS`));
  }

  // ── PM-FME ──
  if (isFood && (isMicro || p.shgFpo)) {
    out.push(E('pm-fme', Math.min(fci * 0.35, 1000000), 35, '35% credit-linked grant for micro food processing (cap ₹10L)', { hasCalc: true }));
  }

  // ── TEQUP ──
  if (isMSME && isMfg && p.energyEfficient) {
    out.push(E('tequp', pm * 0.25, 25, '25% on energy-efficient P&M (BEE-approved)'));
  }

  // ── AIF ──
  if (isAgri || isFood) {
    out.push(E('aif', 20000000 * 0.03 * 7, 3, '3% interest subv on loans up to ₹2 Cr × 7 yr (post-harvest infra, cold storage, processing)'));
  }

  // ── ISEC ──
  if (isKhadi) {
    out.push(E('isec', 0, 4, 'Flat 4% interest — Centre subsidizes difference from bank rate'));
  }

  // ── MUDRA ──
  if ((isMicro || p.unitSize === 'Small') && !p.dpiitStartup && fci > 0) {
    out.push(E('mudra', Math.min(fci, 2000000), 0, 'Collateral-free loan up to ₹20L (Shishu/Kishor/Tarun/Tarun-Plus)'));
  }

  // ── Stand-Up India ──
  if ((isSCST || p.ownerCategory === 'Women') && p.stage === 'New' && fci >= 1000000 && fci <= 10000000) {
    out.push(E('stand-up-india', fci * 0.75, 75, `Greenfield ₹10L-1Cr (75% loan + CGFSI guarantee, ${p.ownerCategory})`));
  }

  // ── CGTMSE ──
  if (isMSME && (isMfg || isService) && !isAgri) {
    out.push(E('cgtmse', 50000000, 0, 'Collateral-free credit up to ₹5 Cr (75-85% guarantee, no cash subsidy)', { isGuarantee: true }));
  }

  // ── CGSS ──
  if (p.dpiitStartup) {
    out.push(E('cgss', 100000000, 0, 'Up to 75% guarantee on loans up to ₹10 Cr (DPIIT startup)', { isGuarantee: true }));
    out.push(E('startup-india', 0, 0, 'IT holiday 3/10 yrs (Sec 80-IAC) + Angel tax exempt + LTCG exempt + Fast-track patent', { isTax: true }));
  }

  // ── SEZ ──
  if (p.insideSEZ) {
    out.push(E('sez', 0, 0, '100% IT holiday (5 yrs) + 50% (next 5) + GST/Customs/Excise exemption', { isTax: true }));
  }

  // ── Exporter benefits ──
  if (p.exporter) {
    out.push(E('rodtep', fci * 0.02, 2, '0.5-4.3% of FOB (8,555+ products, transferable e-script)', { isExport: true }));
    out.push(E('epcg', 0, 0, '0% customs duty on capital goods (vs 6× export obligation in 6 yrs)', { isExport: true }));
    out.push(E('ecgc', 0, 0, 'Export credit insurance 60-90% cover (default + political risk)', { isExport: true }));
    out.push(E('dgft', 0, 0, 'IEC + Advance Authorization + Star House (1-5 Star) + DFIA', { isExport: true }));
  }

  // ── Community schemes (MH) ──
  if (mhResident && p.community === 'Maratha') {
    out.push(E('annasaheb-patil', 300000, 0, 'Interest subvention up to ₹3L (Maratha · IR-1 individual loan up to ₹10L)'));
    out.push(E('sarthi', 0, 0, 'Maratha — Ph.D fellowships, UPSC/MPSC coaching, foreign edu scholarships'));
  }
  if (mhResident && (p.ownerCategory === 'OBC' || p.community === 'OBC' || p.community === 'VJNT')) {
    out.push(E('mahajyoti', 0, 0, 'OBC/VJNT/SBC — Fellowships, free coaching, IT/CA/CS course support'));
  }
  if (mhResident && p.ownerCategory === 'SC') {
    out.push(E('barti', 0, 0, 'SC — Dr. Ambedkar fellowship, free UPSC/MPSC coaching, scholarships'));
  }
  if (mhResident && p.ownerCategory === 'Women') {
    out.push(E('mavim', 300000, 0, 'Women — SHG credit + interest subv up to ₹3L (Tejaswini Scheme)'));
  }

  // ── MH MSME Ancillary (all eligible if MH MSME) ──
  if (mhResident && isMSME) {
    out.push(E('mh-tech-upgrade', 2500000, 50, '50% on additional equipment for tech upgradation (cap ₹25L over 5 yrs)'));
    out.push(E('mh-energy-audit', 200000, 50, '50% audit cost (cap ₹1L water / ₹2L energy)'));
    if (isMfg) out.push(E('mh-energy-eff', 500000, 50, '50% on BEE-rated EE equipment (cap ₹5L)'));
    out.push(E('mh-quality-cert', 200000, 75, '75% certification cost (GMP/Hallmark ₹1L · Patent/GI ₹2L)'));
    out.push(E('mh-zed-cert', 50000, 50, '50% ZED fees (cap ₹50K, stacks with Central ZED)'));
    if (p.smeListing) out.push(E('mh-sme-listing', 500000, 50, '50% SME IPO listing expenses (cap ₹5L)'));
  }

  // ── ZED Central ──
  if (isMSME) {
    out.push(E('zed-cert', 90000, 0, 'Free certification + Bronze ₹10K → Silver ₹40K → Gold ₹90K subsidy'));
  }

  // ── PM Vishwakarma ──
  if (p.traditionalArtisan) {
    out.push(E('pm-vishwakarma', 315000, 0, '₹15K toolkit + ₹1-3L loan @ 5% + skill training + ₹500/day stipend'));
  }

  // ── AHIDF (dairy/poultry/meat) ──
  if (isAgri || (p.subSector && ['Dairy','Meat','Poultry'].some(s => p.subSector === s))) {
    out.push(E('ahidf', 12000000, 3, '3% interest subv × 8 yrs (Dairy/Meat/Poultry processing, project up to ₹50 Cr)'));
  }

  // ── NLM ──
  if (isAgri) {
    out.push(E('nlm', 5000000, 50, '50% capital subsidy (max ₹50L) for Poultry/Sheep/Goat/Piggery/Feed'));
  }

  // ── TUFS (textile) ──
  if (isTextile) {
    out.push(E('tufs', pm * 0.10, 10, '10-15% Capital Investment Subsidy (cap ₹20-30 Cr for textile machinery)'));
  }

  // ── MH Textile Policy ──
  if (mhResident && isTextile) {
    out.push(E('mh-textile-policy', pm * 0.25, 25, '25% capital subsidy + 7% interest subv + Power tariff ₹3/unit (Vidarbha-Marathwada)'));
  }

  // ── MH EV Policy ──
  if (mhResident && p.subSector === 'EV') {
    out.push(E('mh-ev-policy', fci * 0.20, 20, 'Capital subsidy + Charging infra grants + Demand incentive + EV park benefits'));
  }

  // ── MH IT Policy ──
  if (mhResident && isIT) {
    out.push(E('mh-it-policy', fci * 0.30, 30, 'Rental 25-50% (Tier-2/3) + Stamp/ED exemption 7-10 yrs + ₹1L/EPF employee grant'));
  }

  // ── MH Logistics Policy ──
  if (mhResident && p.subSector === 'Logistics') {
    out.push(E('mh-logistics-policy', fci * 0.30, 30, '25-40% capital subsidy (Vidarbha) + Stamp/ED exemption + Land subsidy'));
  }

  // ── MH Aerospace Policy ──
  if (mhResident && p.subSector === 'Aerospace') {
    out.push(E('mh-aerospace-policy', fci * 0.50, 50, 'IPS up to 100% + Enhanced capital subsidy + MIHAN aerospace park (Nagpur)'));
  }

  // Sort by quantum descending
  out.sort((a, b) => b.quantum - a.quantum);
  return out;
}

    state: 'Maharashtra', district: 'Nagpur', location: 'Urban',

    smeListing: false, traditionalArtisan: false, shgFpo: false, insideSEZ: false,

  const upd = (k, v) => setP(prev => ({ ...prev, [k]: v }));

  // Determine zone from district

    if (p.state !== 'Maharashtra') return 'Other';

    return buildWa(lines.join('\n'));

      <div style={{ display:'inline-block', background:'#2D5F5D', color:'#fff', padding:'0.25rem 0.8rem', borderRadius:'999px', fontSize:'0.72rem', fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:'0.8rem' }}>🎯 Smart Matcher</div>
      <h1 className="serif" style={{ fontSize:'clamp(2rem, 5vw, 2.9rem)', fontWeight:600, lineHeight:1.05, marginBottom:'0.5rem', letterSpacing:'-0.02em', color:'#1A2E35' }}>Subsidy Eligibility Wizard</h1>
      <div className="serif" style={{ fontSize:'1.05rem', fontStyle:'italic', color:'#6B5D4F' }}>मला कोणत्या योजना मिळू शकतात? — Find every subsidy you qualify for</div>
      <div style={{ marginTop:'0.6rem', fontSize:'0.85rem', color:'#5C5040' }}>10 simple questions · Instant evaluation across all 43 Central + MH schemes</div>
    </header>

    {!showResults && <>
    <div className="card no-print" style={{ marginBottom:'1.5rem' }}>
      <h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'1rem', color:'#1A2E35' }}>1. व्यवसायाची मूलभूत माहिती · Business Basics</h3>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem' }}>

        </div>
        <div><label className="label-text">Unit Size</label>
          <select className="input-field" value={p.unitSize} onChange={e => upd('unitSize', e.target.value)}>
            <option>Micro</option><option>Small</option><option>Medium</option><option>Large</option>
          </select>
        </div>
        <div><label className="label-text">Sub-sector (Optional)</label>
          <select className="input-field" value={p.subSector} onChange={e => upd('subSector', e.target.value)}>
            <option>General</option><option>Food Processing</option><option>EV</option><option>Aerospace</option>
            <option>Green Energy</option><option>Industry 4.0</option><option>Dairy</option><option>Meat</option>
            <option>Poultry</option><option>Textile</option><option>Logistics</option><option>IT</option>
          </select>
        </div>
      </div>
    </div>

    <div className="card no-print" style={{ marginBottom:'1.5rem' }}>
      <h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'1rem', color:'#1A2E35' }}>2. आर्थिक तपशील · Financial Details (₹ Lakhs)</h3>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem' }}>
        <div><label className="label-text">Project Cost / FCI</label>
          <input className="input-field mono" type="number" value={p.projectCost} onChange={e => upd('projectCost', e.target.value)} placeholder="100" />
        </div>
        <div><label className="label-text">Plant & Machinery</label>
          <input className="input-field mono" type="number" value={p.plantMachinery} onChange={e => upd('plantMachinery', e.target.value)} placeholder="60" />
          <div style={{ fontSize:'0.72rem', color:'#8B7E6B', marginTop:'0.2rem' }}>For CLCSS/SCLCSS/TEQUP calculation</div>
        </div>
      </div>
    </div>

    <div className="card no-print" style={{ marginBottom:'1.5rem' }}>
      <h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'1rem', color:'#1A2E35' }}>3. मालकाचा प्रोफाइल · Owner Profile</h3>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem' }}>
        <div><label className="label-text">Reservation Category</label>
          <select className="input-field" value={p.ownerCategory} onChange={e => upd('ownerCategory', e.target.value)}>
            <option>General</option><option>SC</option><option>ST</option><option>OBC</option>
            <option>Women</option><option>Minority</option><option>PwD</option><option>Ex-Servicemen</option>
          </select>
        </div>
        <div><label className="label-text">Community (for state schemes)</label>
          <select className="input-field" value={p.community} onChange={e => upd('community', e.target.value)}>
            <option>None</option><option>Maratha</option><option>OBC</option><option>VJNT</option>
          </select>
        </div>
        <div><label className="label-text">Age Group</label>
          <select className="input-field" value={p.age} onChange={e => upd('age', e.target.value)}>
            <option>18-45</option><option>45+</option>
          </select>
        </div>
      </div>
    </div>

    <div className="card no-print" style={{ marginBottom:'1.5rem' }}>
      <h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'1rem', color:'#1A2E35' }}>4. ठिकाण · Location</h3>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'1rem' }}>
        <div><label className="label-text">State</label>
          <select className="input-field" value={p.state} onChange={e => upd('state', e.target.value)}>
            <option>Maharashtra</option><option>Other</option>
          </select>
        </div>
        {p.state === 'Maharashtra' && <div><label className="label-text">District (Vidarbha)</label>
          <select className="input-field" value={p.district} onChange={e => upd('district', e.target.value)}>
            {Object.keys(VIDARBHA).map(d => <option key={d}>{d}</option>)}
            <option>Other MH District</option>
          </select>
        </div>}
        <div><label className="label-text">Area</label>
          <select className="input-field" value={p.location} onChange={e => upd('location', e.target.value)}>
            <option>Urban</option><option>Rural</option>
          </select>
        </div>
        {p.state === 'Maharashtra' && <div><label className="label-text">Auto-Zone</label>
          <div style={{ padding:'0.7rem 0.9rem', background:'#F5EFE0', borderRadius:'6px', fontSize:'0.85rem', color:'#5C5040', fontWeight:500 }}>
            {zone === 'Vidarbha-NID' ? '🎯 Vidarbha NID/Naxal (100% IPS)' : zone === 'Vidarbha-Std' ? '✅ Vidarbha Standard (80% IPS)' : '📍 Other MH zone (50% IPS est.)'}
          </div>
        </div>}
      </div>
    </div>

    <div className="card no-print" style={{ marginBottom:'1.5rem' }}>
      <h3 className="serif" style={{ fontSize:'1.15rem', fontWeight:600, marginBottom:'1rem', color:'#1A2E35' }}>5. विशेष माहिती · Special Attributes (check all that apply)</h3>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'0.7rem' }}>
        {[
          { k:'dpiitStartup', label:'DPIIT-recognized Startup', help:'Unlocks Startup India + CGSS' },
          { k:'exporter', label:'Exporter (with IEC)', help:'Unlocks RoDTEP + EPCG + ECGC + DGFT' },
          { k:'insideSEZ', label:'Inside SEZ', help:'Unlocks SEZ tax holiday' },
          { k:'energyEfficient', label:'Energy-efficient tech adoption', help:'Unlocks TEQUP + MH EE Equipment' },
          { k:'shgFpo', label:'SHG / FPO / Co-operative', help:'Unlocks PM-FME group benefit' },
          { k:'smeListing', label:'Planning SME IPO listing', help:'Unlocks MH SME Listing subsidy' },
          { k:'traditionalArtisan', label:'Traditional artisan (18 trades)', help:'Unlocks PM Vishwakarma' },
        ].map(({ k, label, help }) => (
          <label key={k} style={{ display:'flex', alignItems:'flex-start', gap:'0.6rem', padding:'0.7rem 0.9rem', background:p[k]?'#E8F1ED':'#FBF7F0', border:`1px solid ${p[k]?'#7C9885':'#E5DCC9'}`, borderRadius:'6px', cursor:'pointer', transition:'all .2s' }}>
            <input type="checkbox" checked={p[k]} onChange={() => tog(k)} style={{ marginTop:'2px', cursor:'pointer', accentColor:'#2D5F5D' }} />
            <div>
              <div style={{ fontSize:'0.88rem', fontWeight:600, color:'#1A2E35' }}>{label}</div>
              <div style={{ fontSize:'0.72rem', color:'#8B7E6B', marginTop:'0.15rem' }}>{help}</div>
            </div>
          </label>
        ))}
      </div>
    </div>

    <div style={{ textAlign:'center', marginTop:'2rem', marginBottom:'2rem' }}>
      <button className="btn-primary" style={{ padding:'1.05rem 2.8rem', fontSize:'1.05rem' }} onClick={() => { setShowResults(true); setTimeout(() => { const el = document.getElementById('results'); if (el) el.scrollIntoView({ behavior:'smooth' }); }, 100); }}>
        🎯 Check All Eligible Subsidies <ArrowRight size={16} style={{ marginLeft:'0.5rem', display:'inline', verticalAlign:'middle' }} />
      </button>
    </div>
    </>}

    {results && <div id="results">
      <div className="card" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #1A2E35 0%, #2D5F5D 100%)', color:'#FBF7F0', border:'none', textAlign:'center', padding:'2.5rem 1.5rem' }}>
        <div style={{ fontSize:'0.72rem', letterSpacing:'0.3em', textTransform:'uppercase', color:'#A8C5B5', marginBottom:'0.6rem' }}>आपण पात्र आहात · You're Eligible For</div>
        <div className="serif" style={{ fontSize:'clamp(3rem, 8vw, 4.5rem)', fontWeight:600, lineHeight:1, marginBottom:'0.3rem' }}>{eligibleCount}</div>
        <div className="serif" style={{ fontSize:'1.1rem', color:'#A8C5B5', fontStyle:'italic', marginBottom:'1.4rem' }}>government subsidy schemes</div>
        <div style={{ paddingTop:'1.4rem', borderTop:'1px solid rgba(255,255,255,0.15)', display:'inline-block' }}>
          <div style={{ fontSize:'0.72rem', letterSpacing:'0.25em', textTransform:'uppercase', color:'#A8C5B5', marginBottom:'0.4rem' }}>Total Potential Subsidy</div>
          <div className="serif mono" style={{ fontSize:'clamp(1.6rem, 4vw, 2.4rem)', fontWeight:700, color:'#E5C687' }}>~{fmtCr(totalQuantum)}</div>
          <div style={{ fontSize:'0.78rem', color:'#A8C5B5', marginTop:'0.4rem', fontStyle:'italic' }}>(rough lifetime estimate, exact figures vary)</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom:'1.5rem' }}>
        <h3 className="serif" style={{ fontSize:'1.3rem', fontWeight:600, marginBottom:'0.4rem', color:'#1A2E35' }}>Eligible Schemes — Ranked by Quantum</h3>
        <div style={{ fontSize:'0.82rem', color:'#8B7E6B', marginBottom:'1.2rem', fontStyle:'italic' }}>Click any scheme to open detailed info / calculator</div>
        {results.map((r, i) => {
          const sch = SCHEMES.find(s => s.id === r.id);
          if (!sch) return null;
          return <div key={r.id} onClick={() => onOpen(r.id)} style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:'1rem', padding:'1rem 1.1rem', marginBottom:'0.6rem', background:i===0?'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)':'#FBF7F0', borderRadius:'8px', borderLeft:`4px solid ${sch.color}`, cursor:'pointer', transition:'all .2s' }} onMouseEnter={e => e.currentTarget.style.transform='translateX(3px)'} onMouseLeave={e => e.currentTarget.style.transform='translateX(0)'}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:'0.5rem', marginBottom:'0.25rem', flexWrap:'wrap' }}>
                {i === 0 && <span style={{ background:'#E5C687', color:'#5C3D0F', padding:'0.1rem 0.5rem', borderRadius:'4px', fontSize:'0.65rem', fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase' }}>💎 Top</span>}
                <span className="serif" style={{ fontSize:'1.05rem', fontWeight:600, color:'#1A2E35' }}>{sch.name}</span>
                <TypeBadge type={sch.type} />
                {sch.hasCalc && <span style={{ fontSize:'0.7rem', color:'#7C9885', fontWeight:600 }}>🧮 Calculator</span>}
                {r.isGuarantee && <span style={{ fontSize:'0.7rem', color:'#6B8B95', fontWeight:600 }}>🛡 Guarantee</span>}
                {r.isExport && <span style={{ fontSize:'0.7rem', color:'#5C7A7C', fontWeight:600 }}>🌐 Export</span>}
                {r.isTax && <span style={{ fontSize:'0.7rem', color:'#A6504E', fontWeight:600 }}>💼 Tax</span>}
              </div>
              <div style={{ fontSize:'0.82rem', color:'#5C5040', lineHeight:1.5 }}>{r.reason}</div>
            </div>
            <div style={{ textAlign:'right', flexShrink:0 }}>
              {r.quantum > 0 ? <>
                <div className="mono" style={{ fontSize:'1.05rem', fontWeight:700, color:sch.color }}>{fmtCr(r.quantum)}</div>
                {r.ratePct > 0 && <div style={{ fontSize:'0.72rem', color:'#8B7E6B' }}>{r.ratePct.toFixed(0)}% rate</div>}
              </> : <div style={{ fontSize:'0.82rem', fontWeight:600, color:'#7C9885' }}>Qualified ✓</div>}
            </div>
          </div>;
        })}
        {eligibleCount === 0 && <div style={{ padding:'2rem', textAlign:'center', color:'#8B7E6B', fontStyle:'italic' }}>No schemes matched. Try adjusting profile — especially Activity Type, Stage, or Unit Size.</div>}
      </div>

      <div className="card no-print" style={{ marginBottom:'1.5rem', background:'linear-gradient(135deg, #FFFCF5 0%, #F5EFE0 100%)', textAlign:'center', padding:'2rem 1.5rem' }}>
        <div className="serif" style={{ fontSize:'1.2rem', fontWeight:600, marginBottom:'0.5rem', color:'#1A2E35' }}>Want full eligibility audit?</div>
        <div style={{ fontSize:'0.9rem', color:'#5C5040', marginBottom:'1.3rem', maxWidth:'600px', margin:'0 auto 1.3rem' }}>Top 5 schemes आपके WhatsApp message में auto-fill होंगी। CA Shrikant आपको <strong>scheme-wise priority, application sequence, DPR + filing services</strong> guide करेंगे.</div>
        <div style={{ display:'flex', gap:'0.7rem', justifyContent:'center', flexWrap:'wrap' }}>
          <WaButton url={waUrl} label="Discuss My 5 Top Schemes" />
          <button className="btn-primary" onClick={() => window.print()}><Printer size={16} style={{ marginRight:'0.4rem', display:'inline', verticalAlign:'middle' }} />Print Report</button>
          <button className="btn-toggle" onClick={() => { setShowResults(false); window.scrollTo(0, 0); }}>← Modify Profile</button>
        </div>
      </div>
    </div>}

    <Footer />
  </div>;
}

// ════ APP ROUTER ════
function App() {
  const [view, setView] = useState(() => window.location.hash.replace('#', '') || 'home');
  useEffect(() => {
    const onHash = () => setView(window.location.hash.replace('#', '') || 'home');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const open = (id) => { window.location.hash = id; window.scrollTo(0, 0); };
  const back = () => { window.location.hash = ''; window.scrollTo(0, 0); };
  if (view === 'home' || !view) return <><Landing onOpen={open} onWizard={() => { window.location.hash = 'wizard'; window.scrollTo(0, 0); }} /><FloatingWa /></>;
  if (view === 'wizard') return <><EligibilityWizard onBack={back} onOpen={open} /><FloatingWa /></>;
  const scheme = SCHEMES.find(s => s.id === view);
  if (!scheme) return <><Landing onOpen={open} onWizard={() => { window.location.hash = 'wizard'; window.scrollTo(0, 0); }} /><FloatingWa /></>;
  let Component;
  if (scheme.id === 'miisp-2025') Component = MIISPCalc;
  else if (scheme.id === 'pmegp' || scheme.id === 'cmegp') Component = MarginCalc;
  else if (scheme.id === 'clcss') Component = CLCSSCalc;
  else if (scheme.id === 'pm-fme') Component = PMFMECalc;
  else Component = InfoCardView;
  return <><Component scheme={scheme} onBack={back} /><FloatingWa /></>;
}

// ════ MOUNT ════
const root = createRoot(document.getElementById('root'));
root.render(<App />);
setTimeout(() => {
  const loading = document.getElementById('loading');
  if (loading) { loading.classList.add('fade'); setTimeout(() => loading.remove(), 400); }
}, 300);
</script>
</body>
</html>
